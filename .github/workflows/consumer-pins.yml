name: Consumer pins

# The weekly consumer version sync (dstack #399, owner 18.11.2026): once a
# week, Wednesday morning (06:00 UTC: 07:00 CET, 08:00 CEST), read every consumer's
# pinned dstack tag and open or update the one "Weekly consumer version sync"
# issue when any is behind the latest release. The dstack session works that
# issue (each lagging consumer gets its upgrade notes from its own pin);
# consumers are never asked to move per micro-release.
#
# GitHub can drop a scheduled run (25.11.2026 had none, dstack #488): the
# 09:00 and 12:00 UTC crons read only when that day's read is not on the sync
# issue yet (`--once-a-day`); a manual dispatch always reads. A Wednesday
# with every consumer current and no sync issue open leaves no mark, so its
# later crons read again; they find nothing to write either. An update keeps
# the lines below the generated block's marker (`scripts/consumer_pins.py`).

on:
  schedule:
    - cron: "0 6 * * 3"
    - cron: "0 9 * * 3"
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: consumer-pins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: a pin counts as behind only when the library code
          # changed since it (scripts/consumer_pins.py, `library_changed`).
          fetch-depth: 0
          persist-credentials: false
      - name: The reader's own tests
        run: python3 -m unittest scripts/consumer_pins_test.py
      - name: List the sync issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every open one, and the closed ones updated last (an issue the
          # day's read closed is among them): a search's own order is best
          # match, so one listing of all states would lose them as weeks add up.
          fields=number,title,state,body,closedAt,comments
          q="\"Weekly consumer version sync\" in:title"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 20 \
            --search "$q" --json "$fields" > open.json
          gh issue list --repo "$GITHUB_REPOSITORY" --state closed --limit 5 \
            --search "$q sort:updated-desc" --json "$fields" > closed.json
          jq -s add open.json closed.json > issues.json
      - name: Read every consumer's pin
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          once=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then once=(--once-a-day); fi
          python3 scripts/consumer_pins.py --latest "$latest" --date "$(date -u +%F)" \
            --issues issues.json "${once[@]}" --out body.md --github-output "$GITHUB_OUTPUT"
      - name: Open, update or close the sync issue
        if: steps.pins.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LAGGING: ${{ steps.pins.outputs.lagging }}
          ISSUE: ${{ steps.pins.outputs.issue }}
          COMMENT: ${{ steps.pins.outputs.comment }}
          TITLE: ${{ steps.pins.outputs.title }}
        run: |
          set -euo pipefail
          n="$ISSUE"
          if [ "$LAGGING" = "0" ]; then
            # Every consumer runs the latest release: an open sync issue is done.
            if [ -n "$n" ]; then
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$COMMENT"
            fi
          elif [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
