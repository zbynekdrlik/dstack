name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - name: GTK, AppIndicator and ALSA headers (dtray's Linux tray, dlisten's output)
        run: scripts/ci-apt-deps.sh
      - name: Docs build without warnings (broken or private links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: GTK, AppIndicator and ALSA headers (dtray's Linux tray, dlisten's output)
        if: runner.os == 'Linux'
        run: scripts/ci-apt-deps.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows-tools:
    # The PowerShell tools for Windows PCs (tools/windows, dstack #239), tested
    # under Windows PowerShell 5.1, the version the PCs run them with.
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LAN self-heal tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\windows\tests\lan-selfheal.Tests.ps1
      - name: Dante-leg firewall group tests (dstack #264)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\windows\tests\dante-leg.Tests.ps1

  linux-tools:
    # The generic Dante-leg nftables ruleset (tools/linux, dstack #264), loaded
    # for real in a private network namespace (the runner's own rules are not
    # touched). Its port sets are checked against the code by the test job
    # (crates/dstack/tests/dante_leg.rs).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y nftables)
      - name: Dante-leg rulesets load, reload, refuse a load without the interface, untrack only off the leg
        run: sudo bash tools/linux/tests/dante-leg.test.sh

  dsend-audio-driver:
    # dsend's own Windows render endpoint (drivers/dsend-audio, MS-PL; dstack
    # #184), built like dasio's NDIS filter: NuGet WDK, 64-bit MSBuild, the
    # WDK's test signing. The artifact is the installable package.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the driver package
        shell: pwsh
        run: .\drivers\dsend-audio\scripts\build.ps1 -Out dsend-audio-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsend-audio-${{ github.sha }}
          path: dsend-audio-package/
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: GTK, AppIndicator and ALSA headers (dtray's Linux tray, dlisten's output)
        run: scripts/ci-apt-deps.sh
      - name: Line coverage against the floor (.github/coverage-floor)
        run: |
          set -euo pipefail
          floor="$(tr -d '[:space:]' < .github/coverage-floor)"
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines "$floor"

  rtsan:
    # The pump block and the histogram record under RealtimeSanitizer, and
    # the build an application's rtsan job makes of both crates.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with rust-src (rtsan builds std with -Zbuild-std)
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The rtsan test
        env:
          RUSTFLAGS: "-Zsanitizer=realtime --cfg iem_rtsan"
        run: cargo +nightly-2026-09-20 test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p dstack --test rtsan -- --nocapture

  fuzz:
    # Coverage-guided fuzzing of every datagram parser and server a foreign
    # device can reach (fuzz/): 30 s a target. A crash fails the build; its
    # input becomes a regression test in the crate.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain for cargo-fuzz (pinned)
        run: rustup toolchain install nightly-2026-09-20 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: nightly-2026-09-20
      - name: cargo-fuzz (pinned; no prebuilt in install-action)
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: The fuzz lockfile is current (cargo-fuzz has no --locked)
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Fuzz each target for 30 s
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="$(cargo +nightly-2026-09-20 fuzz list)"
          count="$(wc -w <<< "$targets")"
          [ "$count" -eq 8 ] || { echo "::error::cargo fuzz list gave $count targets, not 8: $targets"; exit 1; }
          for target in $targets; do
            echo "::group::$target"
            cargo +nightly-2026-09-20 fuzz run "$target" -- -max_total_time=30
            echo "::endgroup::"
          done

  mutation:
    # Mutants of the PR's own diff only (.cargo/mutants.toml), 8 shards of at
    # most 20 minutes (4 overran with dlisten's 380 mutants, dstack #139); a
    # mutant the tests miss fails the PR (kill it with an assertion). An overrun is a setup bug: shard more or narrow, never a
    # longer timeout.
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      - name: GTK, AppIndicator and ALSA headers (dtray's Linux tray, dlisten's output)
        run: scripts/ci-apt-deps.sh
      - name: Mutants of the diff
        env:
          NEXTEST_PROFILE: mutants
        run: |
          set -euo pipefail
          git diff "origin/${{ github.base_ref }}...HEAD" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No Rust changes against ${{ github.base_ref }}: no mutants to test."
            exit 0
          fi
          status=0
          # Round-robin: a diff's mutants come sorted by file, and a slice
          # of dstack's own (each rebuilds every crate above it) overran one
          # shard's 20 minutes while the others idled (dstack #139).
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --baseline=skip --timeout 60 --jobs 2 --test-workspace=true \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --sharding round-robin \
            --package dstack --package dstack-audio-io --package dlink --package dstack-resample --package dtray --package dlisten --package dstack-endpoint --package dsend --package dstack-asio || status=$?
          if [ -s mutants.out/missed.txt ]; then
            echo "::group::missed mutants"; cat mutants.out/missed.txt; echo "::endgroup::"
          fi
          # 0: all caught; 3: some caught only by a timeout (a hung test is a
          # catch); 2: a mutant missed; anything else: the tool did not run.
          case "$status" in
            0|3) ;;
            2) echo "::error::mutants in this diff survived (above): add assertions that kill them"; exit 2 ;;
            *) echo "::error::cargo-mutants failed to run (exit $status)"; exit "$status" ;;
          esac

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_version.py origin/${{ github.base_ref }}
