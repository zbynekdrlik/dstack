# cargo-mutants: the PR gate in .github/workflows/ci.yml (`mutation`, only the
# mutants in the PR's diff, sharded, 20 minutes a shard at most) and the full
# sweep in .github/workflows/mutation-full.yml (on demand, never on a
# schedule). Both run the unit tests and tests/hot_path.rs per mutant; the
# whole-device tests (system_clock, loopback) bind the Dante ports and run in
# the test job only, and tests/rtsan.rs needs the nightly sanitizer.
profile = "mutants"
test_tool = "nextest"
additional_cargo_test_args = ["--lib", "--test", "hot_path"]
# CI passes --test-workspace=true: every mutant runs the whole workspace's
# tests, so `--test hot_path` (dstack's) exists whichever package a diff
# touches (a diff in dlink or dstack-resample alone failed the baseline
# without it; cargo-mutants 25 reads no config key for it).
# Windows-only code: the gate runs on Linux, where it is not compiled, so
# no test can catch its mutants (CI builds and tests it on Windows).
exclude_globs = [
  "crates/dstack/src/clock/sys_windows.rs",
  "crates/dstack/src/daemon/cli/windows.rs",
  "crates/dstack/src/host/windows.rs",
  "crates/dstack/src/lso/windows.rs",
  "crates/dstack/src/media/bypass/windows.rs",
  "crates/dstack/src/media/dscp/windows.rs",
  "crates/dstack/src/traffic/windows.rs",
  "crates/dtray/src/win.rs",
  # dtray's tray glue (tray-icon, GTK): it needs a desktop session, which a
  # unit test has not; its decisions are the library's (menu, model,
  # desktop: each tested), and it is run by hand on a desktop.
  "crates/dtray/src/linux.rs",
  "crates/dtray/src/tray.rs",
  # dlisten's binary glue (dstack #139): the output device (cpal), the
  # running session (dlink, the network), the OS calls (autostart, the
  # console) and main need a sound card or the process; their decisions
  # are the library's (cli, outputs, settings, status, player, autostart:
  # each tested), and it is run by hand.
  "crates/dlisten/src/main.rs",
  "crates/dlisten/src/audio.rs",
  "crates/dlisten/src/session.rs",
  "crates/dlisten/src/os_linux.rs",
  "crates/dlisten/src/win.rs",
  # The shared endpoint glue (dstack #164): cpal's device list, the PC's
  # name and routed address, the log, Ctrl+C, the Windows console and box;
  # run by dlisten's and dsend's binaries, by hand.
  "crates/dstack-endpoint/src/endpoints.rs",
  "crates/dstack-endpoint/src/host.rs",
  "crates/dstack-endpoint/src/win.rs",
  # dsend's binary glue (dstack #164): the loopback capture and keep-alive
  # (cpal), the run and its session (dlink, the network), Windows only and
  # not built on the gate's Linux, and main; their decisions are the
  # library's (cli, capture, source, status: each tested), and it is run by
  # hand on Windows.
  "crates/dsend/src/main.rs",
  "crates/dsend/src/run.rs",
  "crates/dsend/src/audio.rs",
  "crates/dsend/src/session.rs",
  # Third-party code (mdns-sd, one dstack change; tests/mdns_ipv4_only.rs).
  "vendor/**",
]
# Thin glue no unit test can observe without changing the process: the OS
# priority calls (their decision is `clock::thread_priority_for`, tested) and the
# process-wide profile's wrappers (its logic is `clock::ProfileCell`,
# tested); setting the profile in a test would change every other test.
exclude_re = [
  # Host glue only the whole-host tests run (they cannot run per mutant).
  "replace serve_device -> Result",
  # A binary's main only calls the library (`daemon::cli::main`), and a
  # unit test cannot run it.
  "src/bin/dstack-dev.rs.*replace main",
  # dtray's binary: its entry points and its log setup only call the
  # library (mode_of, the model, the probe, set::latency: each tested);
  # --print and --set-latency are run by hand on dev1.
  "dtray/src/main.rs.*replace (main|print|tray|autostart|set_latency) -> ExitCode",
  "dtray/src/main.rs.*replace init_log with \\(\\)",
  # The registration folder of this PC: reads the process environment
  # (which a test may not set: every other test shares it); its rule
  # `dir_for` is tested.
  "dtray/src/expected.rs.*replace devices_dir -> PathBuf",
  # dtray's discovery on the PC's real interfaces (mDNS on port 5353, which
  # a unit test may not hold per mutant); its rules (own_addresses,
  # local_devices, plan) and the probe are tested.
  "dtray/src/discover.rs.*Scanner::(new|refresh|devices|readings)",
  # The embedding glue and its host paths (no socket, no signal handler):
  # tests/embed.rs runs a whole device with them (not per mutant);
  # Timing::of, their one computation, is unit tested.
  "embed.rs",
  "host.rs.*(prepare_config|Watch::new|Watch::stop)",
  # The media side's per-RX-channel read for apps: glue over the manager
  # and the rings (each tested); crates/dlink/tests/link.rs reads it from a
  # running device (not per mutant).
  "daemon/media.rs.*rx_channels",
  "dlink/src/lib.rs.*Link::rx_channels",
  # The status line for apps: the same glue over `ctl::status` (tested);
  # crates/dlink/tests/link.rs reads it from a running device.
  "dlink/src/lib.rs.*Link::status",
  # The app's status hook for apps: the same glue over
  # `Media::set_app_status` (tested in ctl); crates/dlink/tests/link.rs sets
  # it on a running device.
  "dlink/src/lib.rs.*Link::set_app_status",
  # The app's command hook (dstack #139): the same glue over
  # `Media::set_app_command` (tested in ctl); crates/dlink/tests/link.rs
  # sets it on a running device.
  "dlink/src/lib.rs.*Link::set_app_command",
  # The heartbeat listen's socket loop: tests/system_clock.rs reads our
  # running device with it; its parse and gather are unit tested.
  "latency.rs.*listen",
  # The UDP exchange's start code: tests/system_clock.rs reads our running
  # device's settings through it.
  "client.rs.*call_as",
  # The kernel's socket table read: a test socket never drops, so only the
  # all-zero answer is observable; its parse is tested (media::rx::udp_drops).
  "rx.rs.*socket_drops",
  # The 8700 client's group socket and its wrappers: tests/system_clock.rs
  # reads our running device through the real info group with them; the
  # request, the reply match, the parses and `ask` are unit tested.
  "info/client.rs.*(replace|in) (group_socket|on_group|product_info|board_info|clock_status|network_info|sample_rate|set_sample_rate|set_encoding)\\b",
  # The host frame sender's setter: its Windows branch (the NIC lookup)
  # compiles on Windows only, the rest is a constant false; the host path
  # it sets is tested through TxShared::use_frame_sender.
  "daemon/media.rs.*Media::set_frame_sender",
  "ask_priority",
  # Windows-only (cfg(windows)) power-throttling call: not compiled on the
  # gate's Linux, so its mutants build and cannot fail; CI runs it on Windows.
  "tx.rs.*unthrottle",
  # The MMCSS join (dstack #1): the Windows call is not compiled on the
  # gate's Linux, and its Linux twin is a constant error (a test pins it);
  # the decision is `wants_mmcss` and `priority_outcome` (tested).
  "tx.rs.*(replace join_mmcss -> |in join_mmcss$)",
  # The media threads' re-pin (dstack #1): the Windows SetThreadAffinityMask
  # call is not compiled on the gate's Linux; its decisions (`outcome`,
  # `one_cpu_mask`), the schedule (RePin::due) and the counting are tested,
  # and a Windows test drives it on CI.
  "media/repin.rs.*(replace repin -> |in repin$)",
  # The OS priority call and its log line; the decision is priority_outcome
  # (tested), the call is ask_priority (excluded above).
  "tx.rs.*take_priority",
  # dsync's real follower (dsync-ptp): it binds port 319, which neither CI
  # nor the gate may; the selector's rule (`choose`), `Linked` and `Absorbing`
  # are tested with a fake follower (a fake model for `Absorbing`).
  "linked.rs.*impl Model for dsync_ptp",
  "linked.rs.*start_internal",
  # The selector's log level only (warn on no source, info otherwise).
  "linked.rs.*delete match arm Source::None in Linked::tick",
  # The selector's once-a-second loop (host glue, like serve_device).
  "host.rs.*select_source",
  # The traffic watch's reads and log line; its rule (`look`, `too_much`,
  # `name_of`) is tested, the counters' read by a lib test on the real NIC.
  "traffic.rs.*TrafficWatch::watch",
  "traffic.rs.*nic_sent_bytes",
  # The poller's log lines (log only) and its wrapper aimed at dsync's port
  # (its body `poll` runs against a stand-in server in the tests).
  "clock.rs.*os::log_event",
  "clock.rs.*replace os::poll_dsync with",
  # The CLI's entry points: they run as the binary only (a whole-process
  # path, like src/bin's main); their parse is tested (daemon::parse).
  "daemon/cli.rs.*replace (main|clock) -> ExitCode",
  # Log-only: the qdisc verdict is tested in qdisc::check.
  "qdisc.rs.*report",
  "replace set_profile -> bool",
  # The process-wide spin tail's setter (its value is `spin_tail_of`,
  # tested); setting it in a test would change every other test's waits.
  "replace set_spin_tail_ns with \\(\\)",
  # The bounded escape's setter (dstack #1): the same, its value is
  # `spin_escape_of` (tested), and only the Windows wait reads it.
  "replace set_spin_escape_ms with \\(\\)",
  "replace profile -> TimingProfile",
  # The direct socket needs CAP_NET_RAW, which neither CI nor the gate has;
  # the headers, the ARP lookup and the counting are tested (media::bypass).
  "bypass.rs.*Direct::",
  "bypass.rs.*open_for",
  "tx.rs.*send_one",
  "tx.rs.*direct_mac",
]
