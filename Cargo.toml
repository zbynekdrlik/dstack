[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.29"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/zbynekdrlik/dstack"
authors = ["zbynekdrlik"]

# cargo-mutants builds every mutant with this profile (.cargo/mutants.toml):
# the test profile without debug info, so each mutant builds faster.
[profile.mutants]
inherits = "test"
debug = "none"
