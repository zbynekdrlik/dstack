[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party code with a dstack patch: not linted as ours.
exclude = ["vendor/mdns-sd"]

[workspace.package]
version = "0.6.126"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zbynekdrlik/dstack"
authors = ["zbynekdrlik"]

# cargo-mutants builds every mutant with this profile (.cargo/mutants.toml):
# the test profile without debug info, so each mutant builds faster.
[profile.mutants]
inherits = "test"
debug = "none"

# The resampler's hot path is generic rubato code compiled where it is
# named: optimize it in every profile, so tests and mutants time it as it
# runs (dstack #90; SongPlayer measured the same need).
[profile.dev.package.dstack-resample]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3
