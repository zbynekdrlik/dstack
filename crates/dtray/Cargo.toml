[package]
name = "dtray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
authors.workspace = true
description = "The PC's tray icon for its dstack devices (dlink apps, dasio, dstack-dev, dlisten): clock, subscriptions and late counts; writes only a device's latency and an app's output from its menu"

[lib]
name = "dtray"

[[bin]]
name = "dtray"
path = "src/main.rs"

[dependencies]
dstack = { path = "../dstack" }
# The status line's JSON (already in the lockfile through dstack).
serde_json = "1.0"
# The probe's error (already in the lockfile through dstack).
thiserror = "2.0"
tracing = "0.1"
# `dtray --print`'s log on stderr, RUST_LOG as the devices read it (already
# in the lockfile through dstack).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The expected devices' folder in tests (already in the lockfile through
# dstack's tests).
tempfile = "3"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# The tray icon and its menu (tauri-apps, MIT OR Apache-2.0), as dasio-tray
# uses it. 0.21.2 was published on 2025-10-20. Without its default libxdo
# (muda's predefined Copy/Paste items on Linux, which dtray does not use).
tray-icon = { version = "=0.21.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# GTK's main loop, its 1 s timeout (glib) and the clipboard for the
# Linux tray; the version tray-icon 0.21.2 uses (MIT, published
# 2024-12-09). Builds against libgtk-3-dev; the icon needs
# libayatana-appindicator3 at run time (CI installs both -dev packages).
gtk = "=0.18.2"
glib = "=0.18.5"

[target.'cfg(windows)'.dependencies]
# The message loop and its timer, the single-instance mutex, the clipboard
# the error box, and the autostart's Run value (the version dstack uses).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
