[package]
name = "dstack-asio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
authors.workspace = true
description = "The ASIO host for our apps (dstack #243): a local ASIO driver opened as a host, its buffer switch running the app's Process, and the two sides of a Dante <-> ASIO bridge on dlink::bridge. Windows glue over azo; every decision pure and tested on Linux."

[dependencies]
# The callback contract the driver's buffer switch runs (Process, Block).
dstack-audio-io = { path = "../dstack-audio-io" }
# The bridge's clock crossing: Fifo, Player, AppBuffer (dstack #247).
dlink = { path = "../dlink" }
# The app's clock for the from-ASIO block age (dstack #325).
dstack = { path = "../dstack" }
# The ASRC controller's bound for the bridge's rate seed (dstack #382).
dstack-resample = { path = "../dstack-resample" }
# Already in the lockfile through dstack.
tracing = "0.1"
# `Reason` and `DeviceEvents` over a pipe (SongPlayer's ASIO host process
# sends them whole), behind the `serde` feature; in the lockfile through
# dstack.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
# The whole-device test's config files (tests/to_asio_pull.rs, dstack
# #307); already in the lockfile through dlink.
tempfile = "3"
# The driver side's buffer switch allocates nothing (tests/to_asio_alloc.rs;
# already in the lockfile through dstack).
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[lints.rust]
# `iem_rtsan` is set by the rtsan CI job (nightly, -Zsanitizer=realtime):
# the driver side's buffer switch after its pull (dstack #307).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iem_rtsan)"] }

[target.'cfg(windows)'.dependencies]
# The ASIO host: azo, a pure-Rust COM ASIO host (MIT, no Steinberg SDK, no
# LLVM), SongPlayer's pin (its #233 lane 3) so one azo serves both. Without
# its default `host` feature (a oneshot-based helper thread we do not use).
azo = { version = "=0.4.0", default-features = false }
windows-sys = { version = "0.61", features = [
    # The worker's COM apartment (CoInitializeEx / CoUninitialize) for the
    # driver's life.
    "Win32_System_Com",
    # The worker pumps the driver's window messages (PeekMessageW,
    # TranslateMessage, DispatchMessageW).
    "Win32_UI_WindowsAndMessaging",
] }
