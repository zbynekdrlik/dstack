[package]
name = "dsend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
authors.workspace = true
description = "Sends a PC's sound into Dante: a Windows output's loopback capture (WASAPI) as two TX channels (L, R) of a dlink device, converted to the network's clock and rate through the ASRC"

[lib]
name = "dsend"

[[bin]]
name = "dsend"
path = "src/main.rs"

[dependencies]
dlink = { path = "../dlink" }
# The endpoint glue dsend shares with dlisten (dstack #164): the output's
# choice, the status and process glue, and dlink's bridge (the FIFO, the
# player, the map; dstack #241) re-exported at its old paths.
dstack-endpoint = { path = "../dstack-endpoint" }
# The app status's JSON for dtray (already in the lockfile through dstack).
serde_json = "1.0"
tracing = "0.1"
# The capture thread's MMCSS join (dstack #198) and its error's two kinds
# (`dstack::media::tx::{join_mmcss, MmcssError}`, dstack #281: the log
# line, built on every OS); the status's size bound (dstack::ctl::app_object).
# Already built through dlink.
dstack = { path = "../dstack" }

[target.'cfg(windows)'.dependencies]
# The captured output (WASAPI loopback), as dlisten's output (RustAudio,
# Apache-2.0; already in the lockfile). Windows only: elsewhere dsend
# refuses to run, and its capture glue is not built.
cpal = "=0.18.2"
