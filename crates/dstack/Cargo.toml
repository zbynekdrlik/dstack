[package]
name = "dstack"
version.workspace = true
edition.workspace = true
authors.workspace = true
# MIT OR Apache-2.0 like the workspace (dstack #102): the protocol facts
# were checked against teodly/inferno as a reference; the code is our own.
license.workspace = true
repository.workspace = true
description = "The one Dante stack for our applications: discovery, ARC, CMC, flows, media TX/RX, the clock client of dsync, health, and the engine's pump"

[lib]
name = "dstack"

[dependencies]
# dsync's in-process PTP follower (dstack #68): a dlink device's internal
# clock, on Linux (kernel sockets) and Windows (Npcap, loaded at run time
# since v1.27.0). MIT, our own project.
dsync-ptp = { git = "https://github.com/zbynekdrlik/dsync", tag = "v1.28.1" }
# The engine's callback contract for the pump (phase C, `stream`): Process,
# Block, StreamStats and the stream histograms. MIT OR Apache-2.0, no
# dependency of its own on Linux; the engine already links it.
dstack-audio-io = { path = "../dstack-audio-io" }
# The box's interface addresses for iem-dante-dev's --iface (MIT OR
# BSD-3-Clause); already in the lockfile through mdns-sd.
if-addrs = "0.15"
# The mDNS responder for the device's records (MIT OR Apache-2.0). Its
# blocking API is all the announcer needs, so no `async` feature; `logging`
# keeps its warnings (through `log`) in the daemon's log.
# Vendored with one change (no IPv6 socket): vendor/mdns-sd/DSTACK.md.
mdns-sd = { path = "../../vendor/mdns-sd", version = "0.21.6", default-features = false, features = ["logging"] }
# The RX thread's wait on every RX flow socket at once (epoll on Linux;
# MIT). Already in the lockfile through tokio and mdns-sd, with these
# features.
mio = { version = "1", features = ["net", "os-poll"] }
serde = { version = "1.0", features = ["derive"] }
# `health::parse_status` reads the control socket's status line (MIT OR
# Apache-2.0).
serde_json = "1.0"
# DNS packets for the direct query of a channel record's instance (MIT):
# a transmitter that answers no browse (PTR) query, only its instance
# (dstack #1). 0.12.0 (26.07.2026); 0.13.0 is under two weeks old.
simple-dns = "=0.12.0"
# The RX flow sockets' receive buffer (SO_RCVBUF; MIT OR Apache-2.0).
# Already in the lockfile through tokio.
socket2 = "0.6"
thiserror = "2.0"
# The ARC server's UDP socket and the change signal to the mDNS announcer;
# the daemon's select loop (`macros`), the info server's heartbeat
# (`time`), and iem-dante-dev's runtime and SIGTERM/SIGINT (`rt`,
# `signal`).
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
# The device config and its state file, as the other crates read TOML.
toml = "0.9"
tracing = "0.1"
# iem-dante-dev's log on stderr (the journal), RUST_LOG as the engine reads it.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# dasio (plan Task 2): the precise system time and a high-resolution
# waitable timer (the media clock), MMCSS and thread affinity (the media
# threads), the NIC's MAC and speed (the network info), SIO_UDP_CONNRESET.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_QoS",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The media clock (phase B): clock_gettime(CLOCK_MONOTONIC / CLOCK_REALTIME)
# and clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME). MIT OR Apache-2.0,
# already in the lockfile (through tokio and others).
libc = "0.2"

[dev-dependencies]
# tests/hot_path.rs (phase B): the packet codec, the rings, the sources and
# the checkers allocate nothing, as iem-engine's tests/rt.rs proves it.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
# The state file's tests (a temporary directory), as the other crates use it.
tempfile = "3"
# The socket tests: a runtime, #[tokio::test] and bounded waits.
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints.rust]
# `iem_rtsan` is set by the rtsan CI job (nightly, -Zsanitizer=realtime):
# stream::Pump::block.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iem_rtsan)"] }
